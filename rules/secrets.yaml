# Bí mật bị lộ: API key, token, mật khẩu
rules:
  - id: SEC-GOOGLE-KEY
    name: Google API key
    category: Secrets
    severity: medium
    target: [code, resource, native]
    description: Key Google/Firebase. Kiểm tra key này gọi được những API nào (Maps, Places...).
    hint: Thử bằng keyhacks (streaak/keyhacks) để đánh giá impact.
    strings:
      - 'AIza[0-9A-Za-z_\-]{35}'
    any:
      - 'AIza[0-9A-Za-z_\-]{35}'

  - id: SEC-FIREBASE
    name: Firebase database / project
    category: Secrets
    severity: medium
    target: [code, resource]
    description: Firebase Realtime DB có thể đang mở quyền đọc hoặc ghi công khai.
    hint: Thử truy cập https://<db>.firebaseio.com/.json
    strings:
      - 'https://[\w\-]+\.firebaseio\.com|[\w\-]+\.firebaseapp\.com|[\w\-]+\.appspot\.com'
    any:
      - 'https://[\w\-]+\.firebaseio\.com'
      - '[\w\-]+\.firebaseapp\.com'
      - '[\w\-]+\.appspot\.com'

  - id: SEC-AWS
    name: AWS credential
    category: Secrets
    severity: high
    target: [code, resource, native]
    description: Access key AWS bị hardcode.
    strings:
      - '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      - '[\w\-]+\.s3[\.-][\w\-.]*amazonaws\.com'
    any:
      - '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
      - '[\w\-]+\.s3[\.-][\w\-.]*amazonaws\.com'

  - id: SEC-PRIVATE-KEY
    name: Private key nhúng trong app
    category: Secrets
    severity: high
    target: [code, resource, native]
    description: Khóa riêng (RSA/EC/OpenSSH) nằm trong APK.
    strings:
      - '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
    any:
      - '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'

  - id: SEC-JWT
    name: JWT hardcode
    category: Secrets
    severity: medium
    target: [code, resource]
    description: Token JWT trong code, có thể là token test hoặc token admin bị bỏ quên.
    hint: Decode bằng jwt.io hoặc jwt_tool (có sẵn trong ~/tools/jwt_tool).
    strings:
      - 'eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'
    any:
      - 'eyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}'

  - id: SEC-TOKENS
    name: Token dịch vụ (GitHub, Slack, Stripe, Telegram, Discord...)
    category: Secrets
    severity: high
    mitre: [T1437]
    target: [code, resource, native]
    description: >
      Token của dịch vụ bên thứ ba. Bot Telegram và webhook Discord đặc biệt hay được
      malware dùng làm kênh C2 hoặc exfiltration.
    strings: &tokens
      - 'ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,}'
      - 'xox[baprs]-[A-Za-z0-9\-]{10,}'
      - 'sk_live_[0-9a-zA-Z]{24,}'
      - '\b\d{8,10}:AA[0-9A-Za-z_\-]{33}\b'
      - 'api\.telegram\.org/bot'
      - 'discord(?:app)?\.com/api/webhooks/\d+/[\w\-]+'
      - 'hooks\.slack\.com/services/[\w/]+'
      - 'SG\.[\w\-]{22}\.[\w\-]{43}'
    any: *tokens

  - id: SEC-PASSWORD
    name: Mật khẩu / secret hardcode
    category: Secrets
    severity: medium
    target: [code, resource]
    ignore_case: true
    description: Biến hoặc resource có tên kiểu password/secret/api_key được gán giá trị cứng, hoặc input được so sánh với hằng số.
    exclude:
      - 'res/values(?:-[\w+-]+)?/strings\.xml$'
      - 'res/values-[\w+-]+/'
      - 'res/values/(?:attrs|public|styles|ids)\.xml$'
    any:
      - '\b\w*(?:password|passwd|pwd|secret|api_?key|apikey|access_?token|auth_?token|client_?secret)\w*\s*=\s*"[^"\s]{4,}"'
      - 'name="\w*(?:password|secret|api_?key|token)\w*"\s*>\s*[^<\s@?][^<]{3,}<'
      - '\.equals\(\s*"[^"]{4,}"\s*\)[^;\n]*(?:pass|pin|key)'
      - '(?:pass|pin|key)\w*\.equals\(\s*"[^"]{4,}"\s*\)'
